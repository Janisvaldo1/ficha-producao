<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 - Cadastro de Moldes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="sidebar" aria-label="Menu principal">
        <div class="sidebar-brand">
            <p class="sidebar-name">J J Marmorite</p>
            <p class="sidebar-sub">Ficha de Produção</p>
        </div>
        <a class="side-link" href="/"><span class="num">01</span><span class="side-text"><span class="side-label">Calcular</span><span class="side-desc">Novo recibo e valor a receber</span></span></a>
        <a class="side-link" href="/#produtos"><span class="num">02</span><span class="side-text"><span class="side-label">Tabela de preços</span><span class="side-desc">Códigos, produtos e preços</span></span></a>
        <a class="side-link" href="/#historico"><span class="num">03</span><span class="side-text"><span class="side-label">Histórico</span><span class="side-desc">Recibos salvos por encomenda</span></span></a>
        <a class="side-link active" href="/tela-04.html" aria-current="page"><span class="num">04</span><span class="side-text"><span class="side-label">Moldes</span><span class="side-desc">Cadastro dos moldes</span></span></a>
        <a class="side-link" href="/tela-05.html"><span class="num">05</span><span class="side-text"><span class="side-label">Capacidade</span><span class="side-desc">A encomenda cabe no prazo?</span></span></a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>04 - Cadastro de Moldes</h1>
            <p id="status-texto">Carregando moldes...</p>
        </div>

        <!-- BUSCA -->
        <div class="search-box">
            <input
                type="text"
                id="busca"
                placeholder="Buscar por nome ou código..."
                autocomplete="off"
            >
        </div>

        <!-- LISTA -->
        <div id="lista"></div>

        <!-- FORMULÁRIO -->
        <div id="formulario">
            <div class="form-header">
                <h2 id="form-titulo">Editar Molde</h2>
                <button class="btn-voltar" id="btn-voltar">←</button>
            </div>

            <form id="form-molde">
                <div class="form-group">
                    <label for="unidades">Unidades Disponíveis</label>
                    <input
                        type="number"
                        id="unidades"
                        name="unidades_disponiveis"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="pecas">Peças por Enchimento</label>
                    <input
                        type="number"
                        id="pecas"
                        name="pecas_por_enchimento"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="enchimentos">Enchimentos por Dia</label>
                    <input
                        type="number"
                        id="enchimentos"
                        name="enchimentos_por_dia"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancelar" id="btn-cancelar">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-salvar">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== ESTADO GLOBAL =====
        let moldeLista = [];
        let moldeAtual = null;

        // ===== ELEMENTOS DO DOM =====
        const inputBusca = document.getElementById('busca');
        const divLista = document.getElementById('lista');
        const divFormulario = document.getElementById('formulario');
        const formMolde = document.getElementById('form-molde');
        const btnVoltar = document.getElementById('btn-voltar');
        const btnCancelar = document.getElementById('btn-cancelar');
        const statusTexto = document.getElementById('status-texto');

        // ===== FUNCTIONS =====

        /**
         * Carrega moldes com termo de busca (ou todos se vazio)
         */
        async function carregarMoldes(termo = '') {
            try {
                statusTexto.textContent = 'Carregando moldes...';
                const url = termo ? `/api/moldes?busca=${encodeURIComponent(termo)}` : '/api/moldes';
                const response = await fetch(url);
                if (!response.ok) throw new Error('Erro ao carregar moldes');

                moldeLista = await response.json();
                statusTexto.textContent = `${moldeLista.length} moldes carregados`;
                renderizarLista();
            } catch (erro) {
                console.error(erro);
                statusTexto.textContent = '❌ Erro ao carregar moldes';
                divLista.innerHTML = `<div class="erro">${erro.message}</div>`;
            }
        }

        /**
         * Renderiza a lista de moldes
         */
        function renderizarLista() {
            divLista.innerHTML = '';

            if (moldeLista.length === 0) {
                divLista.innerHTML = '<div class="loading">Nenhum molde encontrado</div>';
                return;
            }

            moldeLista.forEach(molde => {
                const item = document.createElement('div');
                item.className = `molde-item ${molde.cadastrado ? 'cadastrado' : 'nao-cadastrado'}`;
                item.innerHTML = `
                    <div class="molde-info">
                        <div class="molde-nome">${molde.nome}</div>
                        <div class="molde-codigo">#${molde.produto_codigo}</div>
                    </div>
                    <div class="molde-status"></div>
                `;
                item.addEventListener('click', () => abrirFormulario(molde));
                divLista.appendChild(item);
            });
        }

        /**
         * Abre o formulário para editar um molde
         */
        function abrirFormulario(molde) {
            moldeAtual = molde;

            // Preenche formulário com dados já em memória
            document.getElementById('unidades').value = molde.unidades_disponiveis || '';
            document.getElementById('pecas').value = molde.pecas_por_enchimento || '';
            document.getElementById('enchimentos').value = molde.enchimentos_por_dia || '';
            document.getElementById('form-titulo').textContent = `Editar: ${molde.nome}`;

            // Mostra/esconde
            divLista.classList.add('oculto');
            divFormulario.classList.add('ativo');
        }

        /**
         * Volta pra lista
         */
        function fecharFormulario() {
            divLista.classList.remove('oculto');
            divFormulario.classList.remove('ativo');
            moldeAtual = null;
            formMolde.reset();
        }

        /**
 * Salva o molde na API com PUT
 */
async function salvarMolde(event) {
    event.preventDefault();

    if (!moldeAtual) return;
    const molde = moldeAtual;   // ← ADICIONA esta linha (snapshot)

    try {
        // (1) Garante a senha ANTES de qualquer requisição
        let senha = sessionStorage.getItem('senha_moldes');
        if (!senha) {
            senha = prompt('Senha do setor:');
            if (!senha) return;
            sessionStorage.setItem('senha_moldes', senha);
        }

        const dados = {
            unidades_disponiveis: parseInt(document.getElementById('unidades').value),
            pecas_por_enchimento: parseInt(document.getElementById('pecas').value),
            enchimentos_por_dia: parseInt(document.getElementById('enchimentos').value)
        };

        const response = await fetch(`/api/moldes/${molde.produto_codigo}`, {   // ← TROCA moldeAtual por molde
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-Senha': senha
            },
            body: JSON.stringify(dados)
        });

        // ... (resto do if de erros fica igual)

        const moldeAtualizado = await response.json();

        const moldeIndex = moldeLista.findIndex(
            m => m.produto_codigo === molde.produto_codigo    // ← TROCA moldeAtual por molde
        );
        if (moldeIndex !== -1) {
            moldeLista[moldeIndex] = moldeAtualizado;
        }

            fecharFormulario();
            renderizarLista();
        } catch (erro) {
            console.error(erro);
            alert('Erro ao salvar: ' + erro.message);
        }
    }
        // ===== EVENT LISTENERS =====
        inputBusca.addEventListener('input', (e) => {
            const termo = e.target.value.trim();
            carregarMoldes(termo);
        });
        formMolde.addEventListener('submit', salvarMolde);
        btnVoltar.addEventListener('click', fecharFormulario);
        btnCancelar.addEventListener('click', fecharFormulario);

        // ===== INICIALIZAÇÃO =====
        carregarMoldes();
    </script>
</body>
</html>
